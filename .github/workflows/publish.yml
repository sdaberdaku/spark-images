# Builds every row of images.json, smoke-tests it on amd64, then pushes a
# multi-arch image. Runs on pushes to main that touch the image inputs (Renovate
# pull requests bump them); the push step reuses the smoke build's layers.
name: Publish

on:
  push:
    branches: [main]
    paths: [Dockerfile, images.json, requirements.txt, "test/**", .github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      only_cleanup:
        description: Skip publishing and only run the cleanup job
        type: boolean
        default: false
      cleanup_dry_run:
        description: Cleanup only logs what it would delete
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency: publish

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          matrix=$(jq -c '[.[] | . as $r | .python[] | {spark: $r.spark, minor: ($r.spark | split(".") | .[:2] | join(".")), scala: $r.scala, java: $r.java, python: ., python_minor: (. | split(".") | .[:2] | join("."))}]' images.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: ${{ !inputs.only_cleanup && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: spark-smoke:${{ matrix.spark }}-python${{ matrix.python }}
          build-args: |
            SPARK_VERSION=${{ matrix.spark }}
            SCALA_VERSION=${{ matrix.scala }}
            JAVA_VERSION=${{ matrix.java }}
            PYTHON_VERSION=${{ matrix.python }}
      - run: bash test/smoke.sh spark-smoke:${{ matrix.spark }}-python${{ matrix.python }} ${{ matrix.python }}
      - name: Push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sdaberdaku/spark:${{ matrix.spark }}-python${{ matrix.python_minor }}
            ghcr.io/sdaberdaku/spark:${{ matrix.spark }}-python${{ matrix.python }}
            ghcr.io/sdaberdaku/spark:${{ matrix.minor }}-python${{ matrix.python_minor }}
          build-args: |
            SPARK_VERSION=${{ matrix.spark }}
            SCALA_VERSION=${{ matrix.scala }}
            JAVA_VERSION=${{ matrix.java }}
            PYTHON_VERSION=${{ matrix.python }}

  cleanup:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: sdaberdaku
          package: spark
          delete-untagged: true
          older-than: 30 days
          validate: true
          dry-run: ${{ inputs.cleanup_dry_run || false }}
