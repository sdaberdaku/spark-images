# Looks for new Spark and Python lines on Docker Hub once a day and opens a
# pull request that adds them to images.json. No builds run here: the PR gets
# a dispatched ci.yml run (a PR opened with GITHUB_TOKEN does not trigger
# pull_request workflows) and auto-merges once `ci-ok` is green.
name: discover

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-arm an open discovery pull request or clear stale branches
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --json headRefName --jq '.[].headRefName | select(startswith("discover/"))')
          if [ -n "$open" ]; then
            for branch in $open; do
              echo "Open discovery pull request on $branch: re-running CI and re-arming auto-merge."
              gh workflow run ci.yml --ref "$branch"
              gh pr merge "$branch" --auto --squash --delete-branch
            done
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for branch in $(git ls-remote --heads origin 'discover/*' | sed 's#.*refs/heads/##'); do
            echo "Deleting stale branch $branch."
            git push origin --delete "$branch"
          done
      - name: Discover new lines
        id: found
        if: steps.open.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python scripts/discover.py > additions.txt
          cat additions.txt
          if [ -s additions.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the pull request
        if: steps.found.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="discover/$(date -u +%Y%m%d)"
          summary=$(sed -e 's/^spark /Spark /' -e 's/^python /Python /' additions.txt | paste -sd, - | sed 's/,/, /g')
          git switch -c "$branch"
          git add images.json
          git commit -m "feat(images): add $summary"
          python scripts/render_readme.py
          git add README.md
          git commit -m "docs(readme): render tag table for $summary"
          git push origin "$branch"
          {
            echo "Docker Hub has new lines: $summary."
            echo
            echo "Each added row is built and smoke-tested by CI. This pull request merges itself once every row passes. A row that fails the smoke test, for example because a Python version is not supported by that Spark line, has to be trimmed by hand before the merge."
          } > body.md
          gh pr create --base main --head "$branch" --title "feat(images): add $summary" --body-file body.md
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash --delete-branch
