# Looks for new Spark and Python lines on Docker Hub once a day and opens a
# pull request that adds them to images.json. No builds run here: the pull
# request triggers ci.yml itself (a ci.yml dispatch is the fallback when no run
# shows up) and auto-merges once `ci-ok` is green. Each run also repairs an open
# discovery pull request (rebase when behind, close and redo when conflicting)
# and dispatches publish.yml when the latest images.json commit on main has no
# publish run.
name: discover

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish the latest images.json commit when it has no publish run
        run: |
          set -euo pipefail
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=images.json&sha=main&per_page=1" -q '.[0].sha')
          if [ "$(gh run list -w publish.yml -c "$last" --json databaseId -q 'length')" = 0 ]; then
            echo "No publish run for $last: dispatching publish.yml on main."
            gh workflow run publish.yml --ref main
          fi
      - name: Repair an open discovery pull request or clear stale branches
        id: open
        run: |
          set -euo pipefail
          skip=false
          for branch in $(gh pr list --state open --json headRefName --jq '.[].headRefName | select(startswith("discover/"))'); do
            state=$(gh pr view "$branch" --json mergeStateStatus -q .mergeStateStatus)
            echo "Open discovery pull request on $branch ($state)."
            case "$state" in
              DIRTY)
                gh pr close "$branch" --delete-branch
                continue
                ;;
              BEHIND)
                gh pr update-branch "$branch" --rebase
                sleep 5
                ;;
            esac
            scripts/ensure_ci.sh "$branch"
            gh pr merge "$branch" --auto --squash --delete-branch
            skip=true
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = false ]; then
            for branch in $(git ls-remote --heads origin 'discover/*' | sed 's#.*refs/heads/##'); do
              echo "Deleting stale branch $branch."
              git push origin --delete "$branch"
            done
          fi
      - name: Discover new lines
        id: found
        if: steps.open.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python scripts/discover.py > additions.txt
          cat additions.txt
          if [ -s additions.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the pull request
        if: steps.found.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="discover/$(date -u +%Y%m%d)"
          summary=$(sed -e 's/^spark /Spark /' -e 's/^python /Python /' additions.txt | paste -sd, - | sed 's/,/, /g')
          git switch -c "$branch"
          git add images.json
          git commit -m "feat(images): add $summary"
          python scripts/render_readme.py
          git add README.md
          git commit -m "docs(readme): render tag table for $summary"
          git push origin "$branch"
          {
            echo "Docker Hub has new lines: $summary."
            echo
            echo "Each added row is built and smoke-tested by CI. This pull request merges itself once every row passes. A row that fails the smoke test, for example because a Python version is not supported by that Spark line, has to be trimmed by hand before the merge."
          } > body.md
          gh pr create --base main --head "$branch" --title "feat(images): add $summary" --body-file body.md
          scripts/ensure_ci.sh "$branch"
          gh pr merge "$branch" --auto --squash --delete-branch
