# Builds and smoke-tests every row of images.json (amd64) on pull requests.
# Draft PRs skip the build, so `ci-ok` is red on a draft on purpose: mark the
# PR ready for review to run the matrix. `ci-ok` is the single required check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          matrix=$(jq -c '[.[] | . as $r | .python[] | {spark: $r.spark, scala: $r.scala, java: $r.java, python: ., python_minor: (. | split(".") | .[:2] | join("."))}]' images.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: spark-ci:${{ matrix.spark }}-python${{ matrix.python }}
          build-args: |
            SPARK_VERSION=${{ matrix.spark }}
            SCALA_VERSION=${{ matrix.scala }}
            JAVA_VERSION=${{ matrix.java }}
            PYTHON_VERSION=${{ matrix.python }}
          cache-from: type=gha,scope=${{ matrix.spark }}-${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=${{ matrix.spark }}-${{ matrix.python }}
      - run: bash test/smoke.sh spark-ci:${{ matrix.spark }}-python${{ matrix.python }} ${{ matrix.python }}

  readme:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the tag table
        if: github.event_name != 'pull_request'
        run: python scripts/render_readme.py --check
      - name: Regenerate the tag table
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest tests/test_render_readme.py
          python scripts/render_readme.py
          if git diff --quiet README.md; then
            exit 0
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::README.md tag table is stale; run scripts/render_readme.py (fork PRs are not pushed to)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): regenerate tag table" README.md
          git push
          echo "::error::README.md tag table was stale; pushed a fix, a new run follows"
          exit 1

  ci-ok:
    needs: [build, readme]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success && test "${{ needs.readme.result }}" = success
